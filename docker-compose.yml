services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LABEL_LAB_BUILD_SHA: ${LABEL_LAB_BUILD_SHA:-dev}
    image: 3d66-label-system:test
    container_name: 3d66-label-system-test
    ports:
      - "8081:8080"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/database/app.db
      API_KEY_MASTER_KEY_FILE: /data/secrets/master.key
      SESSION_DAYS: 7
    volumes:
      - 3d66-label-system-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  3d66-label-system-data:
    name: 3d66-label-system-data
